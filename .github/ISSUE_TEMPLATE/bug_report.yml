name: Bug Report
description: Report a bug or unexpected behavior on Prisonn.
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Prisonn bug.

        Please provide as much information as possible so the issue can be reproduced and fixed.

        Before submitting:
        - Search existing issues to make sure the bug has not already been reported.
        - Do not include passwords, account credentials, IP addresses, or other private information.

  - type: dropdown
    id: server
    attributes:
      label: Server
      description: Where did the bug happen?
      options:
        - Prisonn
        - PrisonnPvP
        - Both
        - Other / Unsure
    validations:
      required: true

  - type: input
    id: minecraft-version
    attributes:
      label: Minecraft Bedrock Version
      description: Enter the exact Minecraft version you were using.
      placeholder: "Example: 1.26.45"
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      description: What device were you playing on?
      options:
        - Windows
        - Xbox
        - PlayStation
        - Nintendo Switch
        - Android
        - iPhone / iPad
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: Explain what went wrong.
      placeholder: Explain the bug clearly.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Tell us exactly how to make the bug happen.
      placeholder: |
        1. Join Prisonn
        2. Open ...
        3. Select ...
        4. The bug happens
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
      placeholder: Explain what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
      placeholder: Explain what actually happened.
    validations:
      required: true

  - type: textarea
    id: media
    attributes:
      label: Screenshots / Videos
      description: Add screenshots or videos showing the bug if possible.
      placeholder: Drag and drop screenshots or videos here.

  - type: textarea
    id: additional
    attributes:
      label: Additional information
      description: Add anything else that could help us investigate the problem.
      placeholder: Any other useful information.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Confirmations
      options:
        - label: I searched existing issues and did not find this bug already reported.
          required: true
        - label: I provided clear steps to reproduce the issue.
          required: true
        - label: I have not included private or sensitive information.
          required: true